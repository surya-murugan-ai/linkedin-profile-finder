services:
  - type: web
    name: linkedin-profile-finder-api
    env: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      playwright install --with-deps chromium
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.cache/ms-playwright
    healthCheckPath: /health
    autoDeploy: true
    region: oregon

  - type: worker
    name: linkedin-profile-finder-worker
    env: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      playwright install --with-deps chromium
    startCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.cache/ms-playwright
    autoDeploy: true
    region: oregon
